<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
addDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDSPblynHGiZc9fiOorlsD7JK1HWWaivaw",

authDomain: "muj-campus-connect.firebaseapp.com",

projectId: "muj-campus-connect",

storageBucket: "muj-campus-connect.firebasestorage.app",

messagingSenderId: "1018135323599",

appId: "1:1018135323599:web:6a70c9b10b3b4b99ef28ba",

measurementId: "G-Q8VNXYK9LG"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const params =
new URLSearchParams(window.location.search);

const type =
params.get("type");

document.getElementById("type").value = type;

if(type === "rent"){

document.getElementById("durationContainer")
.style.display = "block";

}

document.getElementById("productForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const product = {

name:
document.getElementById("productName").value,

description:
document.getElementById("description").value,

image:
document.getElementById("image").value,

category:
document.getElementById("category").value,

price:
document.getElementById("price").value,

duration:
document.getElementById("duration")?.value || "",

type: type

};

try{

await addDoc(collection(db, "products"), product);

Swal.fire({
icon:'success',
title:'Product Added'
}).then(() => {

if(type === "sell"){

window.location.href = "marketplace.html";

}

else{

window.location.href = "rentals.html";

}

});

}

catch(error){

Swal.fire({
icon:'error',
title:error.message
});

}

});

</script>
