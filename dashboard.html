<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand fw-bold"
href="index.html">

MUJ Campus Connect

</a>

<button
class="btn btn-danger"
id="logoutBtn">

Logout

</button>

</div>

</nav>

<section class="py-5">

<div class="container">

<h1 class="text-center mb-3">

Welcome,
<span id="userName">
Student
</span>

</h1>

<h2 class="text-center mb-5">

Choose Marketplace

</h2>

<div class="row g-4">

<!-- BUY -->

<div class="col-md-6">

<div class="dashboard-card text-center">

<h1>🛒</h1>

<h3 class="mt-3">

Buy Products

</h3>

<p>

Browse products students are selling.

</p>

<a href="marketplace.html"
class="btn btn-primary w-100 mt-3">

Open Marketplace

</a>

</div>

</div>

<!-- RENT -->

<div class="col-md-6">

<div class="dashboard-card text-center">

<h1>📦</h1>

<h3 class="mt-3">

Rent Products

</h3>

<p>

Browse products available for rent.

</p>

<a href="rentals.html"
class="btn btn-warning w-100 mt-3">

Open Rentals

</a>

</div>

</div>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="dashboard.js"></script>

</html>
