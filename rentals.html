<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rentals</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand fw-bold"
href="dashboard.html">

MUJ Campus Connect

</a>

<div class="d-flex gap-2">

<a href="dashboard.html"
class="btn btn-outline-light">

Dashboard

</a>

<a href="add-product.html?type=rent"
class="btn btn-warning">

+ Add Product For Rent

</a>

</div>

</div>

</nav>

<div class="container py-5">

<h1 class="mb-5">
Rentals
</h1>

<div class="row g-4"
id="rentalList">

</div>

</div>

<script>

let rentalList =
document.getElementById("rentalList");

function loadRentals(){

let products =
JSON.parse(localStorage.getItem("products")) || [];

rentalList.innerHTML = "";

let rentProducts =
products.filter(product => product.type === "rent");

rentProducts.forEach(product => {

rentalList.innerHTML += `

<div class="col-md-4">

<div class="card product-card h-100">

<img src="${product.image}">

<div class="card-body d-flex flex-column">

<span class="badge bg-warning text-dark mb-2">
FOR RENT
</span>

<h4>${product.name}</h4>

<p>
Category: ${product.category}
</p>

<p class="price">
₹${product.price}${product.duration}
</p>

<p class="flex-grow-1">
${product.description}
</p>

<button class="btn btn-warning"
onclick="rentProduct(${product.id})">

Rent Now

</button>

</div>

</div>

</div>

`;

});

}

function rentProduct(id){

let products =
JSON.parse(localStorage.getItem("products")) || [];

products =
products.filter(product => product.id !== id);

localStorage.setItem("products",
JSON.stringify(products));

loadRentals();

}

loadRentals();

</script>

</body>
</html>
