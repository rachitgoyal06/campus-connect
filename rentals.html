<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
deleteDoc,
doc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDSPblynHGiZc9fiOorlsD7JK1HWWaivaw",

authDomain: "muj-campus-connect.firebaseapp.com",

projectId: "muj-campus-connect",

storageBucket: "muj-campus-connect.firebasestorage.app",

messagingSenderId: "1018135323599",

appId: "1:1018135323599:web:6a70c9b10b3b4b99ef28ba",

measurementId: "G-Q8VNXYK9LG"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const rentalList =
document.getElementById("rentalList");

async function loadRentals(){

const querySnapshot =
await getDocs(collection(db, "products"));

rentalList.innerHTML = "";

querySnapshot.forEach((firebaseDoc) => {

const product = firebaseDoc.data();

const productId = firebaseDoc.id;

if(product.type === "rent"){

rentalList.innerHTML += `

<div class="col-md-4">

<div class="card product-card h-100">

<img src="${product.image}"
class="card-img-top">

<div class="card-body d-flex flex-column">

<span class="badge bg-warning text-dark mb-2">
FOR RENT
</span>

<h4>${product.name}</h4>

<p>
Category: ${product.category}
</p>

<p class="price">
₹${product.price}${product.duration}
</p>

<p class="flex-grow-1">
${product.description}
</p>

<button
class="btn btn-warning"
onclick="rentProduct('${productId}')">

Rent Now

</button>

</div>

</div>

</div>

`;

}

});

}

window.rentProduct = async function(productId){

try{

await deleteDoc(doc(db, "products", productId));

Swal.fire({
icon:'success',
title:'Product Rented'
});

loadRentals();

}

catch(error){

Swal.fire({
icon:'error',
title:error.message
});

}

}

loadRentals();

</script>
